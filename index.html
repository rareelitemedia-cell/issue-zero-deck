<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Zero — Deck Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a84c; --bg: #080808; --surface: #0f0f0f; --surface2: #151515;
    --border: #1e1e1e; --border2: #282828; --text: #e8e8e8; --muted: #555; --muted2: #888;
    --green: #22c55e; --red: #ef4444;
  }
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-ring { width: 32px; height: 32px; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .logo-ring::after { content: ''; width: 16px; height: 16px; border: 1.5px solid var(--gold); border-radius: 50%; opacity: 0.5; }
  .logo-name { font-family: 'Archivo Black', sans-serif; font-size: 13px; letter-spacing: 0.15em; color: #fff; }
  .logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }
  .main { flex: 1; display: flex; overflow: hidden; height: calc(100vh - 57px); }
  .left { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; }
  .search-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .search-label { font-size: 9px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .search-row { display: flex; gap: 8px; }
  .input-base { background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 9px 12px; outline: none; flex: 1; transition: border-color 0.2s; }
  .input-base:focus { border-color: var(--gold); }
  .input-base::placeholder { color: var(--muted); }
  .search-btn { background: var(--gold); border: none; border-radius: 6px; color: #000; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; padding: 0 14px; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
  .search-btn:hover { opacity: 0.85; }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .biz-info { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .info-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .info-title { font-size: 9px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .biz-name-display { font-family: 'Archivo Black', sans-serif; font-size: 15px; color: #fff; margin-bottom: 3px; }
  .biz-loc { font-size: 10px; color: var(--muted2); }
  .biz-rating { font-size: 11px; color: var(--gold); margin-top: 5px; }
  .biz-desc { font-size: 10px; color: var(--muted2); line-height: 1.7; margin-top: 5px; }
  .photos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .photo-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; border: 1px solid var(--border2); }
  .generate-deck-btn { margin: 0 16px 16px; background: linear-gradient(135deg, var(--gold), #a87830); border: none; border-radius: 8px; color: #000; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; padding: 13px; cursor: pointer; letter-spacing: 0.08em; width: calc(100% - 32px); transition: opacity 0.2s; }
  .generate-deck-btn:hover { opacity: 0.88; }
  .generate-deck-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .right { flex: 1; overflow-y: auto; background: #111; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .right::-webkit-scrollbar { width: 3px; }
  .right::-webkit-scrollbar-thumb { background: var(--border2); }
  .deck-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
  .deck-empty-icon { font-size: 48px; color: var(--border2); }
  .deck-empty-title { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
  .deck-empty-sub { font-size: 10px; color: var(--muted); text-align: center; max-width: 260px; line-height: 1.7; }
  .slide { width: 100%; max-width: 800px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; flex-shrink: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .slide-cover { background: #000; }
  .slide-cover-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0a0a0a 0%, #1a1000 100%); }
  .slide-cover-content { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 5%; }
  .slide-cover-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .slide-iz-logo { font-family: 'Archivo Black', sans-serif; font-size: clamp(10px, 2vw, 18px); letter-spacing: 0.2em; color: var(--gold); }
  .slide-iz-sub { font-size: clamp(6px, 1vw, 10px); color: #555; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 3px; }
  .slide-cover-label { font-size: clamp(7px, 1vw, 11px); color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  .slide-biz-name { font-family: 'Playfair Display', serif; font-size: clamp(18px, 4vw, 42px); color: #fff; line-height: 1.1; }
  .slide-cover-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .slide-cover-tagline { font-size: clamp(7px, 1vw, 11px); color: #444; letter-spacing: 0.1em; font-style: italic; }
  .slide-cover-date { font-size: clamp(7px, 0.9vw, 10px); color: #333; letter-spacing: 0.15em; }
  .slide-cover-line { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); margin: 8px 0; }
  .slide-before { background: #0a0a0a; }
  .slide-label-tag { position: absolute; top: 5%; left: 5%; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: clamp(6px, 0.9vw, 10px); color: #888; padding: 3px 10px; letter-spacing: 0.15em; text-transform: uppercase; z-index: 3; }
  .before-photos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1%; height: 100%; padding: 14% 5% 5%; }
  .before-photo { border-radius: 4px; overflow: hidden; background: #111; }
  .before-photo img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; filter: saturate(0.7); }
  .slide-services { background: #080808; }
  .slide-services-content { position: absolute; inset: 0; padding: 6%; display: flex; flex-direction: column; justify-content: space-between; }
  .slide-section-title { font-size: clamp(7px, 1vw, 11px); color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 5%; }
  .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3%; flex: 1; }
  .service-item { background: rgba(201,168,76,0.05); border: 1px solid rgba(201,168,76,0.15); border-radius: 4px; padding: 4%; display: flex; flex-direction: column; gap: 4px; }
  .service-icon { font-size: clamp(12px, 2vw, 20px); }
  .service-name { font-family: 'Archivo Black', sans-serif; font-size: clamp(7px, 1.1vw, 12px); color: #fff; letter-spacing: 0.05em; }
  .service-desc { font-size: clamp(6px, 0.8vw, 9px); color: #666; line-height: 1.5; }
  .slide-services-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; padding-top: 3%; }
  .services-stat { text-align: center; }
  .stat-big { font-family: 'Archivo Black', sans-serif; font-size: clamp(12px, 2.5vw, 26px); color: var(--gold); }
  .stat-small { font-size: clamp(6px, 0.8vw, 9px); color: #555; letter-spacing: 0.1em; text-transform: uppercase; }
  .slide-cta { background: #000; }
  .slide-cta-content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4%; padding: 8%; }
  .cta-eyebrow { font-size: clamp(7px, 1vw, 11px); color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; }
  .cta-headline { font-family: 'Playfair Display', serif; font-size: clamp(16px, 3.5vw, 38px); color: #fff; line-height: 1.2; }
  .cta-line { height: 1px; width: 30%; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .cta-contact { font-size: clamp(8px, 1.1vw, 12px); color: #888; letter-spacing: 0.1em; }
  .cta-logo { font-family: 'Archivo Black', sans-serif; font-size: clamp(10px, 1.8vw, 18px); color: var(--gold); letter-spacing: 0.2em; margin-top: 2%; }
  .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
  .watermark-text { font-family: 'Archivo Black', sans-serif; font-size: clamp(16px, 3vw, 32px); color: rgba(201,168,76,0.08); letter-spacing: 0.3em; text-transform: uppercase; transform: rotate(-30deg); white-space: nowrap; }
  .slide-num { position: absolute; bottom: 3%; right: 4%; font-size: clamp(6px, 0.8vw, 9px); color: #2a2a2a; letter-spacing: 0.15em; z-index: 5; }
  .download-btn { background: linear-gradient(135deg, var(--gold), #a87830); border: none; border-radius: 8px; color: #000; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; padding: 12px 32px; cursor: pointer; letter-spacing: 0.08em; margin-top: 8px; transition: opacity 0.2s; }
  .download-btn:hover { opacity: 0.88; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 11px; padding: 10px 18px; z-index: 9999; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: #22c55e44; color: var(--green); }
  .toast.error { border-color: #ef444444; color: var(--red); }
  .dots { display: flex; gap: 4px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,100%{opacity:0.2;transform:scale(0.7)}50%{opacity:1;transform:scale(1)} }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header>
  <div class="logo">
    <div class="logo-ring"></div>
    <div>
      <div class="logo-name">ISSUE ZERO</div>
      <div class="logo-sub">Deck Generator</div>
    </div>
  </div>
  <div style="font-size:10px;color:var(--muted);letter-spacing:0.1em">Presenta · Impresiona · Cierra</div>
</header>
<div class="main">
  <div class="left">
    <div class="search-section">
      <div class="search-label">Buscar negocio</div>
      <div class="search-row">
        <input class="input-base" type="text" id="biz-search" placeholder="Ej: La Bohemia Café Tijuana..." onkeydown="if(event.key==='Enter')searchBusiness()" />
        <button class="search-btn" id="search-btn" onclick="searchBusiness()">Buscar</button>
      </div>
    </div>
    <div class="biz-info" id="biz-info" style="display:none"></div>
    <button class="generate-deck-btn" id="gen-btn" style="display:none" onclick="generateDeck()">✦ Generar Deck</button>
  </div>
  <div class="right" id="right-panel">
    <div class="deck-empty">
      <div class="deck-empty-icon">◯</div>
      <div class="deck-empty-title">Deck Generator</div>
      <div class="deck-empty-sub">Busca un negocio para generar su presentación personalizada con fotos reales y servicios de Issue Zero.</div>
    </div>
  </div>
</div>
<script>
const WORKER_URL = "https://floral-block-cf56.rare-elite-media.workers.dev";
let currentBiz = null;

const CAT_LABELS = { medical_spa:"Medical Spa", cafe:"Café", restaurant:"Restaurante", gym:"Gimnasio", bar:"Bar / Coctelería", small_business:"Negocio" };

const SERVICES = {
  medical_spa: [
    {icon:"✦", name:"Identidad Clínica Digital", desc:"Visuales fotorrealistas de tratamientos sin invadir la privacidad de pacientes."},
    {icon:"◈", name:"Contenido 365 días", desc:"Un shoot genera semanas de contenido aspiracional para redes sociales."},
    {icon:"◉", name:"Brand Film Cinematográfico", desc:"Video de marca que posiciona el spa en el mercado premium."},
    {icon:"◆", name:"Lookbook AI", desc:"Campaña visual escalable con IA que muestra resultados de forma aspiracional."},
  ],
  cafe: [
    {icon:"✦", name:"Fotografía Editorial", desc:"Platillos y ambiente en estilo editorial de revista."},
    {icon:"◈", name:"Brand Film", desc:"Video cinematográfico que captura la esencia y atmósfera del espacio."},
    {icon:"◉", name:"Reels de Alta Retención", desc:"Contenido optimizado para Instagram y TikTok con estética premium."},
    {icon:"◆", name:"Escalado AI", desc:"De un shoot sacamos semanas de contenido para todas las plataformas."},
  ],
  restaurant: [
    {icon:"✦", name:"Fotografía Gastronómica", desc:"Editorial de platillos y espacio en nivel de publicación internacional."},
    {icon:"◈", name:"Brand Film", desc:"Campaña cinematográfica que comunica la experiencia del restaurante."},
    {icon:"◉", name:"Contenido Social Premium", desc:"Reels y stories con estética de revista gastronómica."},
    {icon:"◆", name:"Escalado AI", desc:"Múltiples variaciones de campaña desde una sola sesión de producción."},
  ],
  gym: [
    {icon:"✦", name:"Brand Film Aspiracional", desc:"Video de marca que posiciona el gimnasio como destino de lifestyle premium."},
    {icon:"◈", name:"Fotografía Editorial", desc:"Espacio y servicios en estética aspiracional de alto nivel."},
    {icon:"◉", name:"Reels de Alta Retención", desc:"Contenido optimizado para capturar y convertir audiencia digital."},
    {icon:"◆", name:"Campaña AI", desc:"Variaciones infinitas de campaña visual desde una producción."},
  ],
  bar: [
    {icon:"✦", name:"Fotografía Editorial", desc:"Cocteles y ambiente en estética de publicación premium."},
    {icon:"◈", name:"Brand Film Nocturno", desc:"Video cinematográfico que captura la atmósfera y personalidad del espacio."},
    {icon:"◉", name:"Contenido Social Premium", desc:"Reels y stories que generan expectativa y deseo."},
    {icon:"◆", name:"Escalado AI", desc:"Campaña visual completa desde una sola sesión de producción."},
  ],
  small_business: [
    {icon:"✦", name:"Fotografía Editorial", desc:"Imágenes de marca de nivel internacional para destacar en el mercado."},
    {icon:"◈", name:"Brand Film", desc:"Video cinematográfico que cuenta la historia del negocio."},
    {icon:"◉", name:"Identidad Visual Digital", desc:"Contenido premium para redes sociales y plataformas digitales."},
    {icon:"◆", name:"Escalado AI", desc:"Máximo volumen de contenido con mínima inversión de producción."},
  ],
};

let toastTimer;
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 2800);
}

async function searchBusiness() {
  const name = document.getElementById('biz-search').value.trim();
  if (!name) return;
  const btn = document.getElementById('search-btn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-action': 'deck-search' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    currentBiz = data;
    renderBizInfo();
    toast('Negocio encontrado ✓', 'success');
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
  btn.disabled = false; btn.textContent = 'Buscar';
}

function renderBizInfo() {
  const biz = currentBiz;
  const info = document.getElementById('biz-info');
  info.style.display = 'flex';
  document.getElementById('gen-btn').style.display = 'block';
  const photosHtml = biz.photos && biz.photos.length > 0
    ? biz.photos.map(p => `<img class="photo-thumb" src="${p}" alt="" />`).join('')
    : '<div style="color:var(--muted);font-size:10px">Sin fotos disponibles</div>';
  info.innerHTML = `
    <div class="info-block">
      <div class="info-title">Negocio encontrado</div>
      <div class="biz-name-display">${biz.name}</div>
      <div class="biz-loc">${biz.location}</div>
      <div class="biz-rating">★ ${biz.rating} · ${biz.reviews_count} reseñas · ${CAT_LABELS[biz.category]||'Negocio'}</div>
      ${biz.description ? `<div class="biz-desc">${biz.description}</div>` : ''}
    </div>
    <div class="info-block">
      <div class="info-title">Fotos reales del lugar</div>
      <div class="photos-grid">${photosHtml}</div>
    </div>
  `;
}

function generateDeck() {
  if (!currentBiz) return;
  const btn = document.getElementById('gen-btn');
  btn.disabled = true; btn.textContent = '⟳ Generando...';
  try {
    renderDeckPreview();
    toast('Deck generado ✓', 'success');
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
  btn.disabled = false; btn.textContent = '✦ Generar Deck';
}

function renderDeckPreview() {
  const biz = currentBiz;
  const right = document.getElementById('right-panel');
  const today = new Date().toLocaleDateString('es-MX', { year: 'numeric', month: 'long' });
  const services = SERVICES[biz.category] || SERVICES.small_business;
  const totalSlides = 4;

  const beforePhotos = (biz.photos || []).slice(0, 3).map(p =>
    `<div class="before-photo"><img src="${p}" alt="" /></div>`
  ).join('');

  right.innerHTML = `
    <!-- SLIDE 1: COVER -->
    <div class="slide slide-cover">
      <div class="slide-cover-bg"></div>
      <div class="slide-cover-content">
        <div class="slide-cover-top">
          <div>
            <div class="slide-iz-logo">ISSUE ZERO</div>
            <div class="slide-iz-sub">Creative</div>
          </div>
          <div style="text-align:right;font-size:clamp(6px,0.8vw,9px);color:#333;letter-spacing:0.1em">CONFIDENCIAL</div>
        </div>
        <div>
          <div class="slide-cover-label">Propuesta Visual Personalizada para</div>
          <div class="slide-cover-line"></div>
          <div class="slide-biz-name">${biz.name}</div>
          <div style="margin-top:8px;font-size:clamp(7px,1vw,11px);color:#444;letter-spacing:0.1em">${biz.location}</div>
        </div>
        <div class="slide-cover-bottom">
          <div class="slide-cover-tagline">True Cinema Capture + Premium 4K AI Scalability</div>
          <div class="slide-cover-date">${today}</div>
        </div>
      </div>
      <div class="watermark"><div class="watermark-text">ISSUE ZERO</div></div>
      <div class="slide-num">1 / ${totalSlides}</div>
    </div>

    <!-- SLIDE 2: ANTES -->
    <div class="slide slide-before">
      <div class="slide-label-tag">Contenido actual — Antes de Issue Zero</div>
      <div class="before-photos">${beforePhotos}</div>
      <div style="position:absolute;bottom:5%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;z-index:3">
        <div style="font-family:'Playfair Display',serif;font-size:clamp(10px,2vw,20px);color:#fff;font-style:italic">${biz.name}</div>
        <div style="font-size:clamp(6px,0.8vw,9px);color:#555;letter-spacing:0.1em">★ ${biz.rating} · ${biz.reviews_count} reseñas</div>
      </div>
      <div class="watermark"><div class="watermark-text">ISSUE ZERO</div></div>
      <div class="slide-num">2 / ${totalSlides}</div>
    </div>

    <!-- SLIDE 3: SERVICIOS -->
    <div class="slide slide-services">
      <div class="slide-services-content">
        <div class="slide-section-title">Lo que Issue Zero puede hacer por ${biz.name}</div>
        <div class="services-grid">
          ${services.map(s => `
            <div class="service-item">
              <div class="service-icon">${s.icon}</div>
              <div class="service-name">${s.name}</div>
              <div class="service-desc">${s.desc}</div>
            </div>
          `).join('')}
        </div>
        <div class="slide-services-bottom">
          <div class="services-stat"><div class="stat-big">60%</div><div class="stat-small">Optimización presupuesto</div></div>
          <div class="services-stat"><div class="stat-big">12x</div><div class="stat-small">Multiplicador activos</div></div>
          <div class="services-stat"><div class="stat-big">24h</div><div class="stat-small">Respuesta creativa</div></div>
        </div>
      </div>
      <div class="watermark"><div class="watermark-text">ISSUE ZERO</div></div>
      <div class="slide-num">3 / ${totalSlides}</div>
    </div>

    <!-- SLIDE 4: CTA -->
    <div class="slide slide-cta">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a1000 0%,#000 70%)"></div>
      <div class="slide-cta-content">
        <div class="cta-eyebrow">Siguiente paso</div>
        <div class="cta-headline">Transformemos la identidad visual<br>de ${biz.name}</div>
        <div class="cta-line"></div>
        <div class="cta-contact">alexander@theamenitybyalexander.com</div>
        <div class="cta-contact" style="margin-top:-8px">San Diego · Tijuana · Valle de Guadalupe · CDMX</div>
        <div class="cta-logo">ISSUE ZERO CREATIVE</div>
      </div>
      <div class="watermark"><div class="watermark-text">ISSUE ZERO</div></div>
      <div class="slide-num">4 / ${totalSlides}</div>
    </div>

    <button class="download-btn" onclick="downloadPDF()">⬇ Descargar PDF</button>
  `;
}

async function downloadPDF() {
  toast('Abriendo para imprimir como PDF...', 'success');
  window.print();
}
</script>
</body>
</html>
