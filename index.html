  .logo-name { font-family: 'Archivo Black', sans-serif; font-size: 13px; letter-spacing: 0.15em; color: #fff; }
  .logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }
  .main { flex: 1; display: flex; overflow: hidden; height: calc(100vh - 57px); }
  .left { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; }
  .search-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .search-label { font-size: 9px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .search-row { display: flex; gap: 8px; }
  .input-base { background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 9px 12px; outline: none; flex: 1; transition: border-color 0.2s; }
  .input-base:focus { border-color: var(--gold); }
  .input-base::placeholder { color: var(--muted); }
  .search-btn { background: var(--gold); border: none; border-radius: 6px; color: #000; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; padding: 0 14px; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }

  .biz-info { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .info-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .info-title { font-size: 9px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .biz-name-display { font-family: 'Archivo Black', sans-serif; font-size: 14px; color: #fff; margin-bottom: 3px; }
  .biz-loc { font-size: 10px; color: var(--muted2); }
  .biz-rating { font-size: 11px; color: var(--gold); margin-top: 5px; }
  .photos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .photo-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; border: 1px solid var(--border2); }
  .review-item { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
  .review-stars { color: var(--gold); font-size: 9px; margin-bottom: 3px; }
  .review-text { font-size: 9px; color: var(--muted2); line-height: 1.6; }
  .review-author { font-size: 8px; color: var(--muted); margin-top: 4px; }
  .generate-deck-btn { margin: 0 16px 16px; background: linear-gradient(135deg, var(--gold), #a87830); border: none; border-radius: 8px; color: #000; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; padding: 13px; cursor: pointer; letter-spacing: 0.08em; width: calc(100% - 32px); transition: opacity 0.2s; }
  .generate-deck-btn:hover { opacity: 0.88; }
  .generate-deck-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .right { flex: 1; overflow-y: auto; background: #111; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .right::-webkit-scrollbar { width: 3px; }
  .right::-webkit-scrollbar-thumb { background: var(--border2); }
  .deck-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }

  .deck-empty-sub { font-size: 10px; color: var(--muted); text-align: center; max-width: 260px; line-height: 1.7; }
  /* SLIDES */

  .wm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }

  .sn { position: absolute; bottom: 3%; right: 4%; font-size: clamp(6px, 0.7vw, 9px); color: #252525; letter-spacing: 0.15em; z-index: 5; font-family: 'DM Mono', monospace; }
  .iz-badge { font-family: 'Archivo Black', sans-serif; font-size: clamp(8px, 1.5vw, 14px); letter-spacing: 0.2em; color: var(--gold); }
  .iz-badge-sub { font-size: clamp(5px, 0.8vw, 8px); color: #444; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }
  /* Slide 1 - Cover */
  .s-cover { background: #000; }
  .s-cover-bg { position: absolute; inset: 0; background: linear-gradient(145deg, #050505 0%, #120d00 60%, #000 100%); }
  .s-cover-accent { position: absolute; top: 0; right: 0; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.03)); }
  .s-cover-line { position: absolute; left: 5%; top: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, transparent, rgba(201,168,76,0.3), transparent); }
  .s-cover-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 5% 5% 5% 8%; }
  /* Slide 2 - Problem */
  .s-problem { background: #060606; }
  .s-problem-content { position: absolute; inset: 0; padding: 6%; display: flex; gap: 5%; }
  .s-problem-left { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .s-problem-right { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3%; }
  .eyebrow { font-size: clamp(6px, 0.9vw, 10px); color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 4%; }
  .headline { font-family: 'Playfair Display', serif; font-size: clamp(14px, 2.8vw, 32px); color: #fff; line-height: 1.2; margin-bottom: 4%; }
  .body-text { font-size: clamp(6px, 0.9vw, 10px); color: #666; line-height: 1.8; }
  .pain-item { display: flex; align-items: flex-start; gap: 8px; padding: 3% 0; border-bottom: 1px solid #111; }
  .pain-icon { color: #333; font-size: clamp(10px, 1.5vw, 14px); flex-shrink: 0; margin-top: 1px; }
  .pain-text { font-size: clamp(6px, 0.85vw, 10px); color: #555; line-height: 1.6; }
  /* Slide 3 - Before photos */
  .s-before { background: #050505; }
  .s-before-photos { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5%; padding: 12% 3% 3%; }
  .before-photo { overflow: hidden; border-radius: 3px; }
  .before-photo img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.5) brightness(0.7); }
  /* Slide 4 - Solution */
  .s-solution { background: #050505; }
  .s-solution-content { position: absolute; inset: 0; padding: 6%; display: flex; flex-direction: column; justify-content: space-between; }
  .solution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3%; flex: 1; margin-top: 4%; }
  .solution-item { background: rgba(201,168,76,0.04); border: 1px solid rgba(201,168,76,0.12); border-radius: 4px; padding: 4%; }
  .s-icon { font-size: clamp(14px, 2.2vw, 22px); margin-bottom: 6px; }
  .s-name { font-family: 'Archivo Black', sans-serif; font-size: clamp(7px, 1.1vw, 12px); color: #fff; margin-bottom: 4px; letter-spacing: 0.03em; }
  .s-desc { font-size: clamp(6px, 0.8vw, 9px); color: #555; line-height: 1.6; }
  /* Slide 5 - Process */
  .s-process { background: #040404; }
  .s-process-content { position: absolute; inset: 0; padding: 6%; display: flex; flex-direction: column; justify-content: space-between; }
  .process-steps { display: flex; gap: 2%; flex: 1; margin-top: 5%; align-items: stretch; }
  .process-step { flex: 1; display: flex; flex-direction: column; position: relative; }
  .step-num { font-family: 'Archivo Black', sans-serif; font-size: clamp(24px, 4vw, 48px); color: rgba(201,168,76,0.1); line-height: 1; margin-bottom: 4px; }
  .step-line { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); margin-bottom: 10px; }
  .step-name { font-family: 'Archivo Black', sans-serif; font-size: clamp(7px, 1.1vw, 12px); color: #fff; margin-bottom: 6px; }
  .step-desc { font-size: clamp(6px, 0.8vw, 9px); color: #555; line-height: 1.7; }
  .step-connector { position: absolute; right: -4%; top: 15%; color: rgba(201,168,76,0.2); font-size: clamp(10px, 1.5vw, 16px); }
  /* Slide 6 - Economics */
  .s-econ { background: #000; }
  .s-econ-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, rgba(201,168,76,0.05) 0%, transparent 60%); }
  .s-econ-content { position: absolute; inset: 0; padding: 6%; display: flex; flex-direction: column; justify-content: space-between; }
  .econ-stats { display: flex; gap: 3%; flex: 1; margin-top: 5%; }
  .econ-stat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(201,168,76,0.04); border: 1px solid rgba(201,168,76,0.1); border-radius: 6px; padding: 4%; text-align: center; }

  .econ-sub { font-size: clamp(5px, 0.75vw, 8px); color: #333; margin-top: 4px; line-height: 1.5; }
  /* Slide 7 - Testimonial */
  .s-testimonial { background: #040404; }
  .s-testimonial-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8%; text-align: center; }
  .quote-mark { font-family: 'Playfair Display', serif; font-size: clamp(40px, 8vw, 100px); color: rgba(201,168,76,0.08); line-height: 0.5; margin-bottom: 3%; }

  .quote-author { font-size: clamp(7px, 0.9vw, 10px); color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4%; }
  .quote-divider { width: 40px; height: 1px; background: var(--gold); margin: 3% auto; opacity: 0.4; }
  /* Slide 8 - Why IZ */
  .s-why { background: #050505; }
  .s-why-content { position: absolute; inset: 0; padding: 6%; display: flex; gap: 6%; }
  .why-left { flex: 1.2; display: flex; flex-direction: column; justify-content: center; }
  .why-right { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3%; }
  .why-item { display: flex; align-items: flex-start; gap: 10px; padding: 3% 0; border-bottom: 1px solid #0f0f0f; }
  .why-check { color: var(--gold); font-size: clamp(8px, 1.2vw, 13px); flex-shrink: 0; margin-top: 1px; }
  .why-text-title { font-size: clamp(7px, 1vw, 11px); color: #ddd; margin-bottom: 2px; }
  .why-text-sub { font-size: clamp(6px, 0.8vw, 9px); color: #444; line-height: 1.5; }
  /* Slide 9 - Reviews */
  .s-reviews { background: #040404; }
  .s-reviews-content { position: absolute; inset: 0; padding: 6%; display: flex; flex-direction: column; }
  .reviews-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3%; flex: 1; margin-top: 4%; }
  .review-card { background: rgba(255,255,255,0.02); border: 1px solid #111; border-radius: 4px; padding: 4%; display: flex; flex-direction: column; }
  .rc-stars { color: var(--gold); font-size: clamp(7px, 1vw, 11px); margin-bottom: 6px; }
  .rc-text { font-size: clamp(6px, 0.8vw, 9px); color: #555; line-height: 1.7; flex: 1; font-style: italic; }
  .rc-author { font-size: clamp(6px, 0.75vw, 8px); color: #333; margin-top: 8px; letter-spacing: 0.08em; }
  /* Slide 10 - CTA */
  .s-cta { background: #000; }
  .s-cta-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #1a1000 0%, #000 65%); }
  .s-cta-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3%; padding: 8%; }
  .cta-tag { font-size: clamp(7px, 1vw, 11px); color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; }
  .cta-h { font-family: 'Playfair Display', serif; font-size: clamp(16px, 3.5vw, 40px); color: #fff; line-height: 1.2; }
  .cta-div { height: 1px; width: 25%; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .cta-email { font-size: clamp(8px, 1.2vw, 13px); color: #777; letter-spacing: 0.1em; }

  /* Download */
  .download-btn { background: linear-gradient(135deg, var(--gold), #a87830); border: none; border-radius: 8px; color: #000; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; padding: 12px 32px; cursor: pointer; letter-spacing: 0.08em; margin-top: 8px; transition: opacity 0.2s; }
  .download-btn:hover { opacity: 0.88; }
  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 11px; padding: 10px 18px; z-index: 9999; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; }

  .toast.success { border-color: #22c55e44; color: var(--green); }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); }
  @media print {
    header, .left { display: none !important; }
    .main { display: block; height: auto; }
    .right { padding: 0; background: #000; }
    .slide { max-width: 100%; page-break-after: always; border-radius: 0; box-shadow: none; }
    .download-btn { display: none; }
  }
</style>
</head>

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

let toastTimer;
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 2800);
}

async function searchBusiness() {
  const name = document.getElementById('biz-search').value.trim();
  if (!name) return;
  const btn = document.getElementById('search-btn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-action': 'deck-search' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    currentBiz = data;
    renderBizInfo();
    toast('Negocio encontrado ✓', 'success');
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
  btn.disabled = false; btn.textContent = 'Buscar';
}

function updateAfterPreview(n) {
  const url = document.getElementById('after-' + n).value.trim();
  const prev = document.getElementById('prev-' + n);
  if (url) {
    prev.style.display = 'block';
    prev.querySelector('img').src = url;
  } else {
    prev.style.display = 'none';

  // Auto-regenerate deck if already visible
  const right = document.getElementById('right-panel');
  if (right.querySelector('.slide')) generateDeck();
}

async function downloadDeck() {
  const slides = document.querySelectorAll('.slide');
  if (!slides.length) { toast('Genera el deck primero', 'error'); return; }

  const btn = document.querySelector('.download-btn');
  btn.disabled = true;
  btn.textContent = '⟳ Cargando...';
  toast('Cargando librerías PDF...', 'success');

  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    
    btn.textContent = '⟳ Procesando...';
    toast('Generando PDF...', 'success');

    const { jsPDF } = window.jspdf;
    const W = 1280, H = 720;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [W, H], compress: true });

    for (let i = 0; i < slides.length; i++) {
      if (i > 0) pdf.addPage([W, H], 'landscape');
      btn.textContent = `⟳ Slide ${i+1}/${slides.length}...`;

      const canvas = await html2canvas(slides[i], {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#000',
        imageTimeout: 8000,
        logging: false,
      });

      const img = canvas.toDataURL('image/jpeg', 0.9);
      pdf.addImage(img, 'JPEG', 0, 0, W, H, '', 'FAST');
    }

    const name = (currentBiz?.name || 'Deck').replace(/[^a-zA-Z0-9]/g, '_');
    pdf.save('IssueZero_' + name + '.pdf');
    toast('PDF descargado ✓', 'success');
  } catch(e) {
    toast('Error exportando: ' + e.message, 'error');
    console.error(e);
  }

  btn.disabled = false;
  btn.textContent = '⬇ Descargar PDF';
}
